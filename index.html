<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="format-detection" content="telephone=no">

<title>Cosmotalk – L’anglais du CP à la 3e</title>
<style>:root{
  --ink:#16233F; --ink2:#4A5878; --paper:#F2F4F8; --card:#FFFFFF; --red:#C8102E; --red2:#8E0B20; --sky:#2F6FA3;
  --gold:#E3A008; --green:#2E8B57; --line:#D8DEE8; --kraft:#E9DFC9; --bad:#B3261E;
  --head:"Roboto Condensed","Arial Narrow",sans-serif-condensed,"Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,Roboto,"Segoe UI",Arial,sans-serif;
  --serif:Georgia,"Noto Serif","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{max-width:680px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));position:relative}
.airmail{height:8px;margin:0 -16px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 22px,var(--sky) 22px 36px,#fff 36px 44px)}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:30px;line-height:1.1} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--ink2)} small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
.top button,.ghost{background:none;border:0;padding:8px 6px;font-weight:600;color:var(--ink2)}
.miles{font-family:var(--head);font-weight:700;color:var(--sky);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:11px 16px;font-weight:700}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.blue{background:var(--sky);border-color:var(--sky);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 140px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}

/* ---------- couverture / profils ---------- */
.cover{background:var(--ink);color:#F4E7C2;border-radius:0 0 22px 22px;margin:0 -16px;padding:34px 22px 28px;text-align:center;position:relative}
.cover .logo{font-family:var(--head);font-size:46px;font-weight:700;letter-spacing:.02em;line-height:1}
.cover .logo span{color:var(--gold)}
.cover p{margin:8px 0 0;color:#C9CFDD}
.cover svg{width:86px;height:86px;margin:0 auto 10px;display:block}
.prof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.prof .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none}
.prof b{font-size:18px}.prof .grow{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:8px}.pick button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:16px}
.pick button[aria-pressed=true]{border-color:var(--ink);background:#E9EEF7}
.pick.av button{font-size:28px;padding:4px 10px}
input[type=text]{width:100%;font:inherit;font-size:20px;-webkit-appearance:none;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label.lab{display:block;font-weight:700;margin:14px 0 6px}

/* ---------- carte du voyage ---------- */
.hello{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.route{position:relative;margin:18px 0 10px;padding-left:46px}
.route:before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:6px;border-radius:3px;background:linear-gradient(var(--red) 0 52%,transparent 52% 58%,var(--gold) 58%)}
.sea{position:relative;margin:4px 0 4px -46px;padding:10px 0 10px 46px;color:var(--sky);font-family:var(--head);font-weight:700;font-size:15px}
.sea:before{content:"";position:absolute;left:21px;top:0;bottom:0;border-left:6px dotted var(--sky)}
.stop{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.stop:before{content:"";position:absolute;left:-33px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--red)}
.stop.us:before{border-color:var(--gold)}
.stop.me{border:2px solid var(--ink)}
.stop .thumb{width:96px;flex:none;border-radius:6px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.stop .thumb svg{display:block;width:100%;height:auto}
.stop .info{flex:1;min-width:0}
.stop .city{font-family:var(--head);font-size:21px;font-weight:700;line-height:1.1}
.stop .lvl{display:inline-block;font-weight:700;font-size:14px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px}
.bar{height:8px;background:#E6EAF1;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
.nav{display:flex;gap:8px;margin-top:14px}.nav .btn{flex:1;font-size:15px;padding:10px 8px}

/* ---------- étape (niveau) ---------- */
.postcard{background:#fff;padding:10px 10px 12px;border-radius:6px;box-shadow:0 1px 0 var(--line),0 8px 22px rgba(22,35,63,.10);transform:rotate(-1.2deg);margin:8px 6px 18px}
.postcard svg{display:block;width:100%;height:auto;border-radius:2px}
.postcard .cap{font-family:var(--serif);font-size:16px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.postcard .fact{font-family:var(--serif);font-size:15px;color:var(--ink2);margin:6px 0 0}
.line{position:relative;padding-left:58px;margin-top:6px}
.line:before{content:"";position:absolute;left:25px;top:20px;bottom:20px;width:6px;border-radius:3px;background:var(--red)}
.line.us:before{background:var(--gold)}
.mrow{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;min-height:64px}
.mrow .st{position:absolute;left:-56px;top:50%;margin-top:-26px}
.mrow.locked{opacity:.55}
.mrow .t{flex:1;font-weight:700;line-height:1.25}
.mrow .meta{display:block;font-weight:400;font-size:14px;color:var(--ink2)}
.tier{color:var(--gold);letter-spacing:1px;font-size:13px}
.sk{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--ink2);border-radius:5px;padding:0 5px;margin-right:4px;color:var(--ink2)}
.best{font-family:var(--head);font-weight:700;font-size:18px}

/* tampons */
.stamp{width:52px;height:52px;display:block}
.stamp text{font-family:var(--head);font-weight:700}

/* ---------- feuille de mission ---------- */
.veil{position:fixed;inset:0;background:rgba(22,35,63,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet .memo{background:#fff;border-left:5px solid var(--sky);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:15px}
.sheet .memo ul{margin:6px 0 0;padding-left:18px;columns:2;column-gap:18px}
.sheet .memo li{break-inside:avoid}

/* ---------- questions ---------- */
.qhead{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.qhead .prog{flex:1;height:10px;background:#E1E6EF;border-radius:5px;overflow:hidden}.qhead .prog i{display:block;height:100%;background:var(--sky);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin:8px 0}
.prompt{font-weight:700;color:var(--ink2);margin:0 0 10px}
.story{font-family:var(--serif);font-size:18px;line-height:1.6;background:#FBF8F1;border-left:5px solid var(--gold);padding:10px 12px;border-radius:6px;margin:0 0 12px}
.qtext{font-size:23px;font-weight:600;margin:6px 0 12px;line-height:1.35}
.qtext.big{font-size:34px;text-align:center}
.qimg{display:flex;justify-content:center;margin:6px 0 12px}
.listen{display:flex;gap:10px;justify-content:center;margin:4px 0 14px}
.say{border:2px solid var(--sky);background:#EAF2F9;color:var(--sky);border-radius:999px;padding:10px 18px;font-weight:700;font-size:18px}
.say.big{font-size:22px;padding:14px 26px}
.opts{display:grid;gap:10px}
.opts.imgs{grid-template-columns:repeat(2,1fr)}
.opt{position:relative;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:19px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px;min-height:56px}
.opts.imgs .opt{justify-content:center;min-height:110px;padding:10px}
.opt.num{justify-content:center;font-size:28px;font-family:var(--head)}
.opt.num .lbl{text-align:center}
.opts.nums{grid-template-columns:repeat(2,1fr)}
.opt .lbl{flex:1}
.opt .os{border:0;background:#EAF2F9;color:var(--sky);border-radius:8px;padding:6px 9px;font-size:16px;flex:none}
.opt.ok{border-color:var(--green);background:#E7F4EC}
.opt.no{border-color:var(--bad);background:#FBEAEA;opacity:.7}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{justify-content:center;font-size:22px}
.emo{font-size:58px;line-height:1}
.emo.sm{font-size:38px}
.sw{display:inline-block;width:76px;height:76px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.multi{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:150px;font-size:30px;line-height:1.1}
.scene{position:relative;width:120px;height:96px}
.scene .o{position:absolute;font-size:40px;line-height:1}
.hint{background:#FFF7E0;border:1px solid #F0D58A;border-radius:10px;padding:10px 12px;margin:12px 0 0;font-size:16px}
.feedback{margin:12px 0 0;font-weight:700;font-size:18px}
.feedback.good{color:var(--green)}.feedback.bad{color:var(--bad)}
.qfoot{display:flex;gap:10px;margin-top:12px}.qfoot .btn{flex:1}
.typein{display:flex;gap:8px}.typein input{flex:1}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:2px solid var(--ink2);background:#fff;border-radius:8px;padding:8px 11px;font-size:18px;font-weight:600}
.answerline{min-height:56px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answerline .tok{border-color:var(--sky);background:#EAF2F9}
.answerline .end{font-size:22px;font-weight:700;margin-left:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- résultats ---------- */
.result{text-align:center;padding:10px 0}
.score{font-family:var(--head);font-size:64px;font-weight:700;line-height:1}
.score small{font-size:26px;color:var(--ink2)}
.bigstamp{width:140px;height:140px;margin:6px auto;display:block}
.land{animation:land .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes land{0%{transform:scale(2.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.rev{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.rev .mk{font-size:20px;flex:none;width:26px;text-align:center}
.rev .body{flex:1;min-width:0}
.rev .yours{color:var(--bad)} .rev .sol{color:var(--green);font-weight:700}
.rev.err{border-color:#E9B3B0}
.rev .fixer{margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.land,.shake{animation:none}.qhead .prog i{transition:none}}
@media (max-width:380px){h1{font-size:26px}.cover .logo{font-size:38px}.stop .thumb{width:76px}.opts.imgs .opt{min-height:96px}.emo{font-size:48px}}
</style></head>

/* ---- constructeur de QCM ----
   opts : tableau de libellés ou d'objets {label,img,say}. La 1re option est la bonne. */
function mcq(o){
  var opts = o.opts.map(function(x){ return typeof x==='string'?{label:x}:x; });
  var good = opts[0];
  var keys={}; opts = opts.filter(function(x){ var k=(x.label||'')+'|'+(x.img||''); if(keys[k]) return false; keys[k]=1; return true; });
  if(!o.fixed) opts = R.shuffle(opts);
  return {type:'choice', prompt:o.prompt, text:o.text, say:o.say, img:o.img, opts:opts, ans:opts.indexOf(good),
    hint:o.hint, quiet:o.quiet, sol:o.sol||good.label, key:o.key||(o.text||'')+(o.say||'')+good.label, optSay:o.optSay, big:o.big, story:o.story};
}
function tf(o){ // vrai / faux
  var q = mcq({prompt:o.prompt||'Vrai ou faux ?', text:o.text, say:o.say, img:o.img, hint:o.hint, key:o.key, fixed:true,
    opts: o.val?[{label:'Vrai',tf:1},{label:'Faux',tf:1}]:[{label:'Faux',tf:1},{label:'Vrai',tf:1}]});
  q.opts = [q.opts.filter(function(x){return x.label==='Vrai';})[0], q.opts.filter(function(x){return x.label==='Faux';})[0]];
  q.ans = o.val?0:1; q.sol = o.val?'Vrai':'Faux'; q.tf=true; if(o.sol) q.sol=o.sol;
  return q;
}
function typed(o){
  return {type:'type', prompt:o.prompt, text:o.text, say:o.say, img:o.img, ans:o.ans, alts:(o.alts||[]).concat([o.ans]),
    hint:o.hint, sol:o.ans, key:o.key||(o.text||'')+(o.say||'')+o.ans, ph:o.ph};
}
function order(o){ // o.s : phrase correcte
  var m = o.s.match(/^(.*?)([.!?])$/); var body=m?m[1]:o.s, end=m?m[2]:'';
  var toks = body.split(' ');
  var sh; var n=0; do { sh=R.shuffle(toks); n++; } while(sh.join(' ')===toks.join(' ') && n<20);
  return {type:'order', prompt:o.prompt||'Remets les mots dans l’ordre.', toks:toks, shuf:sh, end:end, ans:o.s,
    hint:o.hint, sol:o.s, key:o.s, say:o.say, fr:o.fr};
}

        optSay:true, hint:'Touche 🔊 à côté de chaque mot pour l’entendre. Le bon mot commence par « '+t.en.charAt(0)+' ».', key:'I'+t.en});
      case 'frEn': return mcq({prompt:'Comment dit-on en anglais ?', text:cap(t.fr), big:true, opts:all.map(function(x){return x.en;}), hint:hint, key:'F'+t.en, optSay:opt.optSay});
      case 'enFr': return mcq({prompt:'Que veut dire ce mot ?', text:t.en, say:t.en, opts:all.map(function(x){return x.fr;}), hint:'Touche 🔊 pour entendre le mot et cherche un mot français proche du thème de la mission.', key:'E'+t.en, sol:t.fr});
      case 'spell': return typed({prompt:'Écris le mot anglais.', img:t.img, say:opt.spellSay?t.en:null, ans:t.en, alts:opt.alts&&opt.alts[t.en]||[],
        hint:'Il commence par « '+t.en.charAt(0)+' » et compte '+t.en.replace(/[^a-z]/gi,'').length+' lettres.', key:'S'+t.en});
      case 'dictee': return typed({prompt:'Écoute et écris le mot.', say:t.en, ans:t.en, alts:opt.alts&&opt.alts[t.en]||[],
        hint:'Il veut dire '+t.fr+'. Il commence par « '+t.en.charAt(0)+' » ('+t.en.replace(/[^a-z]/gi,'').length+' lettres).', key:'D'+t.en});
      case 'tf': {
        var val = Math.random()<0.5; var shown = val?t:others[0];
        var phrase = opt.tfPhrase? opt.tfPhrase(t) : ("It's "+(t.img.indexOf('sw:')===0?t.en:withArt(t.en))+'.');
        return tf({prompt:'Écoute. Vrai ou faux ?', say:phrase, img:shown.img, val:val, key:'T'+t.en+val,

function numGen(a,b,modes){

    var near = uniq([n, n+1, n-1, n+10, n-10, (n%10)*10+Math.floor(n/10), n+2, n-2].filter(function(x){return x>=lo&&x<=hi;}));
    var g=0; while(near.length<4&&g++<50){ var z=R.int(lo,hi); if(near.indexOf(z)<0) near.push(z); }
    var d = R.sample(near.slice(1),3); var opts=[n].concat(d);
    if(opts.length<3){ while(opts.length<4){ var z=R.int(a,b); if(opts.indexOf(z)<0) opts.push(z);} }
    var w=numWord(n);
    if(mode==='listen') return mcq({prompt:'Écoute et touche le bon nombre.', say:w, opts:opts.map(function(x){return {label:String(x),num:1};}), sol:n+' ('+w+')',

    if(mode==='read') return mcq({prompt:'Quel nombre est écrit ?', text:w, opts:opts.map(function(x){return {label:String(x),num:1};}), sol:n+' ('+w+')',
      hint:'Attention : thirteen (13) / thirty (30), fourteen (14) / forty (40)… -teen = de 13 à 19, -ty = les dizaines.', key:'W'+n});
    if(mode==='word') return mcq({prompt:'Comment s’écrit ce nombre ?', text:String(n), big:true, opts:[w].concat(n===40?['fourty']:[]).concat(d.map(numWord)).slice(0,4),
      hint:'40 s’écrit forty (sans u). Les nombres composés prennent un trait d’union : forty-two.', key:'P'+n});
    if(mode==='spell') return typed({prompt:'Écris ce nombre en lettres.', text:String(n), ans:w, alts:[w.replace('-',' ')],
      hint:'Pense au trait d’union entre la dizaine et l’unité (ex. twenty-one). 40 = forty.', key:'Y'+n});
    if(mode==='calc'){ var x=R.int(1,Math.min(10,b-1)), y=R.int(1,Math.min(10,b-x)); var s=x+y;
      return mcq({prompt:'Calcule en anglais.', text:numWord(x)+' plus '+numWord(y)+' = ?', say:numWord(x)+' plus '+numWord(y),
        opts:uniq([numWord(s),numWord(s+1),numWord(Math.max(0,s-1)),numWord(s+2)]), hint:numWord(x)+' = '+x+', '+numWord(y)+' = '+y+'.', key:'C'+x+'+'+y}); }
    if(mode==='count'){ var it=R.pick(cat('pets','farm','food').filter(function(x){return x.pl;})); var k=R.int(1,Math.min(b,6));
      var ph=numWord(k)+' '+(k>1?it.pl:it.en);
      var ks=R.sample([1,2,3,4,5,6].filter(function(x){return x!==k;}),2);
      return mcq({prompt:'Écoute et touche la bonne image.', say:ph, opts:[k].concat(ks).map(function(x){return {label:'',img:'multi:'+it.img+':'+x};}),
        hint:'Écoute le nombre : '+ph+' = '+k+'.', sol:ph, key:'K'+ph}); }
  };
}

/* ---- l'heure ---- */
function timeWords(h,m){ // style britannique
  var nh = h%12+1, hw = numWord(h===0?12:h);
  if(m===0) return hw+" o'clock";
  if(m===30) return 'half past '+hw;
  if(m===15) return 'quarter past '+hw;
  if(m===45) return 'quarter to '+numWord(nh===0?12:nh);
  if(m<30) return numWord(m)+' past '+hw;
  return numWord(60-m)+' to '+numWord(nh===0?12:nh);
}
function timeGen(mins, mode){
  return function(){
    var h=R.int(1,12), m=R.pick(mins), w=timeWords(h,m);
    var cands = uniq([w, timeWords(h,(m+30)%60), timeWords(h%12+1,m), timeWords(h, m===15?45:m===45?15:(m+15)%60), timeWords((h+10)%12+1,m)]);
    var hint = m===0?"o'clock = heure pile.": m===30?'half past = et demie : on dit l’heure qui vient de passer.':
      m===15?'quarter past = et quart.': m===45?'quarter to = moins le quart : on dit l’heure qui arrive.':
      (m<30?'past = « après » : minutes après l’heure passée.':'to = « moins » : minutes avant l’heure qui arrive.');
    if(mode==='listen') return mcq({prompt:'Écoute et touche la bonne horloge.', say:"It's "+w+'.', opts:cands.slice(0,3).map(function(x,i){
        var hm = i===0?[h,m]:null; return {label:'',img:'clk:'+(hm?hm.join(':'):parseClock(x))};}), hint:hint, sol:"It's "+w+'.', key:'H'+h+':'+m});
    return mcq({prompt:'Quelle heure est-il ?', img:'clk:'+h+':'+m, opts:cands.slice(0,4).map(function(x){return "It's "+x+'.';}), hint:hint, key:'h'+h+':'+m});
  };

    var w=uniq(['had '+v.past, hv+' '+v.pp, 'had '+v.b]).filter(function(x){return x!=='had '+v.pp;});

function digitalGen(){ var mw=function(m){ return m===0?"o'clock":m<10?'oh '+numWord(m):numWord(m); };

    var lab=function(H,M){ return H+':'+(M<10?'0':'')+M; }, say=function(H,M){ return "It's "+numWord(H)+' '+mw(M)+'.'; };
    var alt=[[h,m],[h%12+1,m],[h,(m+10)%60],[h,(m%10)*10+Math.floor(m/10)<60?(m%10)*10+Math.floor(m/10):(m+20)%60],[(h+5)%12+1,m]];
    var seen={}, c=[]; alt.forEach(function(x){ var k=lab(x[0],x[1]); if(!seen[k]){ seen[k]=1; c.push(x); } });
    var hint='Heure digitale : on lit les heures, puis les minutes. 7:05 se dit « seven oh five », 7:00 « seven o’clock », 7:45 « seven forty-five ».';

function cardSVG(key, revealed, cls){ // revealed : tableau de 20 booléens (ou true)
  var tiles='';
  if(revealed!==true){ for(var i=0;i<20;i++){ if(revealed&&revealed[i]) continue; var x=(i%5)*60, y=Math.floor(i/5)*50;
    tiles+='<rect x="'+x+'" y="'+y+'" width="60" height="50" fill="#E9DFC9" stroke="#D3C6A8" stroke-width="1"/><text x="'+(x+30)+'" y="'+(y+31)+'" font-size="15" text-anchor="middle" fill="#C9BA97" font-family="Georgia,serif">'+(i+1)+'</text>'; } }
  return '<svg class="'+(cls||'card')+'" viewBox="0 0 300 200" role="img" aria-hidden="true">'+CARDS[key].replace(/id="(\w+)"/g,'id="$1'+key+'"').replace(/url\(#(\w+)\)/g,'url(#$1'+key+')')+tiles+'</svg>';
}

(function(){
var KEY='cosmotalk.v1', MAXP=6, NQ=10, PASS=15, GOLD=18;
var AVATARS=['🦊','🐻','🐼','🐯','🦁','🐸','🐵','🐧','🦉','🐨','🐙','🦄'];
var COLORS=['#C8102E','#2F6FA3','#2E8B57','#E3A008','#7E4FB0','#16233F'];
var SKN={E:'Écouter',L:'Lire',Ec:'Écrire',D:'Dialoguer',G:'Grammaire',C:'Culture',B:'Bilan'};

/* ---------- stockage ---------- */
var mem={};
var Store={ get:function(){ try{ var v=window.localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){} return mem.v?JSON.parse(mem.v):null; },
  set:function(o){ var s=JSON.stringify(o); mem.v=s; try{ window.localStorage.setItem(KEY,s); }catch(e){} } };
var canSave=(function(){ try{ var k='__et_test'; localStorage.setItem(k,'1'); var ok=localStorage.getItem(k)==='1'; localStorage.removeItem(k); return ok; }catch(e){ return false; } })();
var store=Store.get()||{profiles:[],current:null};
function save(){ Store.set(store); }
function P(){ return store.profiles.filter(function(p){return p.id===store.current;})[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function lvl(id){ return LEVELS.filter(function(l){return l.id===id;})[0]; }
function best(p,m){ return (p.best&&p.best[m.id])||0; }
function unlocked(p,L,m){ return p.open||m.n===0||best(p,L.missions[m.n-1])>=PASS; }
function lit(p,L){ return L.missions.map(function(m){return best(p,m)>=PASS;}); }
function litCount(p,L){ return lit(p,L).filter(Boolean).length; }

var voices=[]; function loadVoices(){ try{ voices=window.speechSynthesis?speechSynthesis.getVoices():[]; }catch(e){} }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
var curLang='en-GB';
function speak(text, slow){
  var p=P(), lang=(p&&p.accent&&p.accent!=='auto')?p.accent:curLang, rate=slow?0.62:((p&&p.rate)||0.9);
  text=String(text).replace(/___/g,'…').replace(/’/g,"'");
  if(window.Android&&Android.speak){ try{ Android.speak(text,lang,rate); return; }catch(e){} }
  if(!window.speechSynthesis){ toast('La lecture à voix haute n’est pas disponible ici.'); return; }
  speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=rate;
  var v=voices.filter(function(x){return x.lang&&x.lang.replace('_','-')===lang;})[0]||voices.filter(function(x){return /^en/i.test(x.lang);})[0];
  if(v) u.voice=v; else if(voices.length) toast('Aucune voix anglaise installée sur cet appareil.');
  speechSynthesis.speak(u);
}
var IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

var CLOTH_E={'👕':'T-shirt','👗':'dress','👒':'hat','🧢':'cap','🧥':'coat'};
function clockSVG(h,m,sz){ sz=sz||96; var ha=((h%12)+m/60)*30, ma=m*6, t='';
  for(var i=0;i<12;i++){ var a=i*30*Math.PI/180; t+='<line x1="'+(50+38*Math.sin(a))+'" y1="'+(50-38*Math.cos(a))+'" x2="'+(50+43*Math.sin(a))+'" y2="'+(50-43*Math.cos(a))+'" stroke="#16233F" stroke-width="'+(i%3?2:4)+'"/>'; }
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#fff" stroke="#16233F" stroke-width="4"/>'+t+
    '<line x1="50" y1="50" x2="'+(50+24*Math.sin(ha*Math.PI/180))+'" y2="'+(50-24*Math.cos(ha*Math.PI/180))+'" stroke="#16233F" stroke-width="6" stroke-linecap="round"/>'+
    '<line x1="50" y1="50" x2="'+(50+36*Math.sin(ma*Math.PI/180))+'" y2="'+(50-36*Math.cos(ma*Math.PI/180))+'" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#16233F"/></svg>'; }
function scene(a,b,rel){ // a = sujet (emoji), b = repère (boîte ou sac)
  var T=function(x,y,sz){ return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" text-anchor="middle" dominant-baseline="central">'+a+'</text>'; };
  var box=function(x,w,open){ var o='<g>'; if(open) o+='<polygon points="'+x+',40 '+(x+w)+',40 '+(x+w-6)+',34 '+(x+6)+',34" fill="#6B4423"/>';
    o+='<rect x="'+x+'" y="40" width="'+w+'" height="30" fill="#B07A45" stroke="#6B4423" stroke-width="2"/><line x1="'+x+'" y1="55" x2="'+(x+w)+'" y2="55" stroke="#8A5A2E" stroke-width="1.5"/>';
    o+='<rect x="'+(x+3)+'" y="70" width="5" height="22" fill="#6B4423"/><rect x="'+(x+w-8)+'" y="70" width="5" height="22" fill="#6B4423"/></g>'; return o; };
  var front=function(x,w){ return '<rect x="'+x+'" y="44" width="'+w+'" height="26" fill="#B07A45" stroke="#6B4423" stroke-width="2"/><line x1="'+x+'" y1="55" x2="'+(x+w)+'" y2="55" stroke="#8A5A2E" stroke-width="1.5"/>'; };
  var o='';
  switch(rel){
    case 'in': o=box(32,56,true)+T(60,40,26)+front(32,56); break;
    case 'on': o=box(32,56)+T(60,22,30); break;
    case 'under': o=box(32,56)+T(60,82,20); break;
    case 'next to': o=box(14,50)+T(96,60,30); break;
    case 'behind': o=T(66,40,34)+box(32,56); break;
    case 'in front of': o=box(32,56)+T(60,76,34); break;
    case 'between': o=box(2,36)+T(60,60,26)+box(82,36); break;
  }
  return '<svg width="120" height="96" viewBox="0 0 120 96" aria-hidden="true">'+o+'</svg>'; }
function img(spec, small){
  if(!spec) return '';
  if(spec.indexOf('sw:')===0) return '<span class="sw" style="background:'+spec.slice(3)+'"></span>';
  if(spec.indexOf('clk:')===0){ var t=spec.slice(4).split(':'); return clockSVG(+t[0],+t[1],small?84:110); }
  if(spec.indexOf('prep:')===0){ var p=spec.slice(5).split(':'); return scene(p[0],p[1],p[2]); }
  if(spec.indexOf('multi:')===0){ var q=spec.slice(6).split(':'), s=''; for(var i=0;i<+q[1];i++) s+=q[0]; return '<span class="multi">'+s+'</span>'; }
  if(spec.indexOf('ec:')===0){ var r=spec.slice(3).split(':'), k=CLOTH_E[r[0]]||r[0], col=r[1];
    return '<svg width="86" height="86" viewBox="0 0 100 100" aria-hidden="true"><path d="'+CLOTH[k]+'" fill="'+col+'" stroke="#16233F" stroke-width="3" stroke-linejoin="round"/></svg>'; }
  return '<span class="emo'+(small?' sm':'')+'">'+spec+'</span>';
}
function stampSVG(m,score,cls){ var c=score>=20?'#E3A008':score>=GOLD?'#C8102E':score>=PASS?'#2F6FA3':'#B9C1CF', on=score>=PASS;
  var rot=((m.n*37)%17)-8;
  return '<svg class="'+(cls||'stamp')+'" viewBox="0 0 60 60" aria-hidden="true"><g transform="rotate('+rot+' 30 30)">'+
   '<circle cx="30" cy="30" r="26" fill="'+(on?'#fff':'#F2F4F8')+'" stroke="'+c+'" stroke-width="3" '+(on?'':'stroke-dasharray="4 4"')+'/>'+
   '<circle cx="30" cy="30" r="20" fill="none" stroke="'+c+'" stroke-width="1.4"/>'+
   '<text x="30" y="'+(on?'37':'36')+'" font-size="'+(on?20:17)+'" text-anchor="middle" fill="'+c+'">'+(m.n+1)+'</text>'+
   (score>=20?'<text x="30" y="17" font-size="9" text-anchor="middle" fill="'+c+'">★</text>':'')+'</g></svg>'; }

/* ---------- série ---------- */
function series(m,n){ var out=[], keys={}, tries=0, last=null;
  while(out.length<n&&tries<400){ tries++; var q=m.gen(); if(!q) continue;
    if(keys[q.key]&&tries<300) continue; if(q.key===last) continue; keys[q.key]=1; last=q.key; out.push(q); }
  return out; }
function startQuiz(L,m){ quiz={L:L,m:m,qs:series(m,NQ),i:0,res:[],tries:0,spoken:false,showHint:false,locked:false,picked:[],typed:'',built:[]}; go('quiz'); }

  if(q.say&&!q.quiet&&!q.text) h+=sayBtns(q); else if(q.say&&!q.quiet) h+=sayBtns(q);

   '<p style="font-size:15pt">'+(all?'pour avoir réussi les 180 missions, de Londres à San Francisco.':'pour avoir réussi les 20 missions de l’étape '+L.label+' · '+L.city+'.')+'</p>'+
   (all?'':'<div style="width:120mm;margin:10mm auto">'+cardSVG(L.card,true)+'<p style="font-family:Georgia,serif">'+esc(L.title)+' — '+esc(L.fact)+'</p></div>')+
   '<p style="margin-top:14mm">Le '+new Date().toLocaleDateString('fr-FR')+'</p></div>';
  printHTML(all?'Diplôme Cosmotalk':'Certificat '+L.label,b); }

/* ---------- actions ---------- */
function curQ(ctx){ if(ctx==='q') return quiz.qs[quiz.i]; return quiz.qs[+ctx.slice(1)]; }
window.ET={
  go:function(n,o){ go(n,o); },
  pick:function(id){ store.current=id; save(); go('home'); },
  newProf:function(){ form={name:'',avatar:AVATARS[store.profiles.length%AVATARS.length],color:COLORS[store.profiles.length%COLORS.length],level:'cp'}; render(); },
  editProf:function(id){ var p=store.profiles.filter(function(x){return x.id===id;})[0]; form={id:id,name:p.name,avatar:p.avatar,color:p.color,level:p.level}; render(); },
  cancelProf:function(){ form=null; render(); },
  fset:function(k,v){ var n=$('pname'); if(n) form.name=n.value; form[k]=v; render(); },
  saveProf:function(){ var n=($('pname').value||'').trim(); if(!n){ toast('Écris un prénom ou un surnom.'); return; } form.name=n;
    if(form.id){ var p=store.profiles.filter(function(x){return x.id===form.id;})[0]; p.name=form.name; p.avatar=form.avatar; p.color=form.color; p.level=form.level; }
    else { var id='p'+Date.now().toString(36); store.profiles.push({id:id,name:form.name,avatar:form.avatar,color:form.color,level:form.level,miles:0,best:{},open:false,accent:'auto',rate:0.9}); store.current=id; }
    save(); var lv=form.level, isNew=!form.id; form=null; if(isNew) go('level',{lv:lv}); else render(); },
  sheet:function(lid,n){ var L=lvl(lid), m=L.missions[n]; var d=document.createElement('div'); d.id='sheet'; d.innerHTML=sheetHTML(L,m); document.body.appendChild(d); var b=d.querySelector('.btn.primary'); if(b&&!b.disabled) b.focus(); },
  closeSheet:function(){ var d=$('sheet'); if(d) d.remove(); },
  start:function(lid,n){ ET.closeSheet(); var L=lvl(lid); startQuiz(L,L.missions[n]); },
  worksheet:function(lid,n){ var L=lvl(lid); worksheet(L,L.missions[n]); },
  quit:function(){ if(confirm('Quitter la mission ? Ta série en cours ne sera pas comptée.')) go('level',{lv:quiz.L.id}); },
  say:function(slow){ var q=quiz.qs[quiz.i]; speak(q.say,slow); },
  sayText:function(ctx){ speak(curQ(ctx).say); },
  sayOpt:function(ctx,i){ speak(curQ(ctx).opts[i].label); },
  hint:function(){ quiz.showHint=true; render(); },
  choose:function(ctx,i){ if(ctx==='q'){ if(quiz.locked) return; grade(i); return; }
    var k=+ctx.slice(1), q=quiz.qs[k], f=quiz.fix[k]; if(i===q.ans) fixDone(k); else { f.wrong=(f.wrong||[]).concat([i]); f.msg='Non, relis le coup de pouce.'; render(); var el=$('rev'+k); if(el) el.scrollIntoView({block:'center'}); } },
  submitType:function(ctx){ var el=$(ctx==='q'?'typein':'ty_'+ctx); var v=(el&&el.value||'').trim(); if(!v){ toast('Écris ta réponse.'); return; }
    if(ctx==='q'){ quiz.typed=v; grade(v); return; }
    var k=+ctx.slice(1), q=quiz.qs[k], f=quiz.fix[k]; f.typed=v; if(check(q,v)) fixDone(k); else { f.msg='Pas encore. Vérifie chaque lettre.'; render(); var r=$('rev'+k); if(r) r.scrollIntoView({block:'center'}); } },
  tok:function(ctx,i){ if(ctx==='q'){ quiz.built.push(i); render(); return; } var f=quiz.fix[+ctx.slice(1)]; f.built=(f.built||[]).concat([i]); render(); },
  unTok:function(ctx,k){ if(ctx==='q'){ quiz.built.splice(k,1); render(); return; } quiz.fix[+ctx.slice(1)].built.splice(k,1); render(); },
  clearTok:function(ctx){ if(ctx==='q'){ quiz.built=[]; render(); return; } quiz.fix[+ctx.slice(1)].built=[]; render(); },
  submitOrder:function(ctx){ var q=curQ(ctx), b=ctx==='q'?quiz.built:quiz.fix[+ctx.slice(1)].built, s=b.map(function(i){return q.shuf[i];}).join(' ');
    if(ctx==='q'){ grade(s); return; } var k=+ctx.slice(1); if(check(q,s)) fixDone(k); else { quiz.fix[k].msg='Pas encore. Regarde où se place le verbe.'; quiz.fix[k].built=[]; render(); } },
  next:function(){ nextQ(); },
  openFix:function(i){ quiz.fix[i]={open:true}; render(); var el=$('rev'+i); if(el) el.scrollIntoView({block:'start'}); var q=quiz.qs[i]; if(q.say&&!q.quiet&&!q.text) speak(q.say); },
  showSol:function(i){ fixDone(i,true); },
  printBilan:printBilan,
  printLevel:function(id){ printLevel(lvl(id)); },
  cert:cert,
  gate:function(){ var v=+($('gate').value||0); if(v===gateQ[0]*gateQ[1]){ gateOK=true; render(); } else { toast('Ce n’est pas le bon résultat.'); gateQ=null; render(); } },
  toggleOpen:function(){ var p=P(); p.open=!p.open; save(); render(); },
  pset:function(k,v){ var p=P(); p[k]=v; save(); render(); },
  testVoice:function(){ curLang=(P().accent&&P().accent!=='auto')?P().accent:'en-GB'; speak('Hello! Welcome to Cosmotalk. Let’s talk and travel together!'); },
  resetProf:function(){ if(!confirm('Effacer toute la progression de '+P().name+' ?')) return; var p=P(); p.best={}; p.miles=0; save(); toast('Progression remise à zéro.'); render(); },
  delProf:function(){ if(!confirm('Supprimer le profil de '+P().name+' ?')) return; store.profiles=store.profiles.filter(function(x){return x.id!==store.current;}); store.current=null; save(); gateOK=false; go('profiles'); },
  exportData:function(){ var s=JSON.stringify(store), name='cosmotalk-sauvegarde.json';
    if(window.Android&&Android.saveFile){ try{ Android.saveFile(name,s,'application/json'); toast('Sauvegarde enregistrée dans Téléchargements.'); return; }catch(e){} }
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); },
  importData:function(file){ if(!file) return; var r=new FileReader(); r.onload=function(){ try{ var o=JSON.parse(r.result); if(!o.profiles) throw 0; store=o; save(); toast('Sauvegarde importée.'); go('profiles'); }catch(e){ toast('Ce fichier n’est pas une sauvegarde Cosmotalk.'); } }; r.readAsText(file); }
};
document.addEventListener('keydown',function(e){ if(e.key==='Escape') ET.closeSheet(); });
window.ETback=function(){ // bouton retour Android
  if($('sheet')){ ET.closeSheet(); return true; }
  if(form){ form=null; render(); return true; }
  if(view.name==='quiz'){ ET.quit(); return true; }
  if(view.name==='result'||view.name==='level'){ go(view.name==='result'?'level':'home',{lv:quiz&&quiz.L.id||view.lv}); return true; }
  if(view.name==='home'){ go('profiles'); return true; }
  if(view.name==='passport'||view.name==='parents'){ go('home'); return true; }
  return false; };
if(store.current&&P()) view={name:'home'};
render();
})();


</script></body></html>
